<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Voice Presence</title>
		<script src="sdpi-components.js"></script>
		<script>
			// sdpi-components reads __MSG_key__ and <sdpi-i18n key="key"> from this
			// object. The language comes from the Stream Deck app when available,
			// with the browser language as the initial fallback.
			const normalizeLanguage = (value) =>
				typeof value === "string" && value !== "" ? value.split(/[-_]/)[0] : "en";

			SDPIComponents.i18n.locales = {
				en: {
					backgroundColor: "Background color",
					backgroundColorHelp: "Color of the Infobar card behind the avatars.",
					helpTitle: "First launch",
					helpBody:
						"Place the \"Voice Channel (Infobar)\" action on your Stream Deck Neo, then press \"Reconnect to Discord\" once. Discord will ask for permission.\n\nVoice Presence shows the avatars of everyone in your voice channel. It works alongside the Discord plugin from Elgato, which keeps its mute, deafen, and join keys."
				},
				fr: {
					backgroundColor: "Couleur de fond",
					backgroundColorHelp: "Couleur de la carte de l'Infobar derrière les avatars.",
					helpTitle: "Premier lancement",
					helpBody:
						"Place l'action « Salon vocal (Infobar) » sur ton Stream Deck Neo, puis appuie une fois sur « Se reconnecter à Discord ». Discord demandera l'autorisation.\n\nVoice Presence affiche les avatars des personnes présentes dans ton salon vocal. Il fonctionne avec le plugin Discord d'Elgato, qui garde ses touches muet, sourdine et rejoindre."
				}
			};

			const browserLanguage = normalizeLanguage(navigator.language);
			SDPIComponents.i18n.language = browserLanguage;
			document.documentElement.lang = browserLanguage;

			// Stream Deck passes its own application language in the PI info
			// payload. Prefer it over the browser language so the PI follows the
			// app locale, including its region fallback (fr-FR -> fr).
			const connect = window.connectElgatoStreamDeckSocket;
			window.connectElgatoStreamDeckSocket = (...args) => {
				try {
					const info = JSON.parse(args[3]);
					const language = normalizeLanguage(info?.application?.language);
					SDPIComponents.i18n.language = language;
					document.documentElement.lang = language;
				} catch {
					// Keep the browser language when the payload is unavailable.
				}
				connect(...args);
			};
		</script>
		<style>
			body {
				visibility: hidden;
			}

			body.ready {
				visibility: visible;
			}

			.note {
				font-size: 11px;
				line-height: 1.5;
				color: #969696;
				white-space: pre-line;
			}

			.note strong {
				color: #d8d8d8;
			}
		</style>
	</head>

	<body>
		<!--
			Saving is automatic: `setting` persists the value as soon as it changes,
			with no Save button. This is what the Marketplace guidelines expect.
		-->
		<sdpi-item label="__MSG_backgroundColor__">
			<sdpi-color setting="backgroundColor" default="#000000"></sdpi-color>
		</sdpi-item>

		<sdpi-item label="">
			<div class="note"><sdpi-i18n key="backgroundColorHelp"></sdpi-i18n></div>
		</sdpi-item>

		<sdpi-item label="">
			<div class="note">
				<strong><sdpi-i18n key="helpTitle"></sdpi-i18n></strong>
				<sdpi-i18n key="helpBody"></sdpi-i18n>
			</div>
		</sdpi-item>

		<script>
			const show = () => document.body.classList.add("ready");
			document.addEventListener("DOMContentLoaded", show);
			// Safety net: even if a component fails to load, the PI must not stay
			// invisible.
			setTimeout(show, 1_000);
		</script>
	</body>
</html>
